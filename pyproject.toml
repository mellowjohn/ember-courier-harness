[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-courier-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<5", "Pillow>=12.1,<13"]

[project.scripts]
contract-lock = "ember_harness.contract_lock:main"
ember-ui = "ember_harness.local_ui:main"

[tool.setuptools.packages.find]
include = ["ember_harness*"]

[tool.setuptools.package-data]
ember_harness = ["schema/*.json", "ui.html", "polish_browser.js"]
